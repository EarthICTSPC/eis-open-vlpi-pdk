name: GitHub2Agent-002 cold checkout

on:
  push:
    branches:
      - github2agent-002-cold-ci

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/github2agent-002/test_schema_conformance.py
