experiment:
  id: "VLPI-PDK-001"
  title: "Cross-PDK RU Realization Matrix"
  status: "executable-reference-mock-experiment"
  controlledInput:
    ir: "examples/vlpi-platform-002/ru001-program.yaml"
    ru: "ru/RU-001/ru.yaml"
    contract: "ru/RU-001/contract.yaml"
    designContext: "ru/RU-001/design-context.yaml"
  environments:
    - id: "EIS-REFERENCE-VLPI-PDK"
      class: "eis-reference"
      fixture: "examples/vlpi-pdk-001/pdks/eis-reference.yaml"
      expectedDisposition: "compatible"
    - id: "MOCK-STATE-BOUNDARY-FAIL"
      class: "hostile-mock"
      fixture: "examples/vlpi-pdk-001/pdks/mock-state-boundary-fail.yaml"
      expectedDisposition: "incompatible"
      expectedFailureDimension: "stateBoundary"
    - id: "MOCK-THERMAL-FAIL"
      class: "hostile-mock"
      fixture: "examples/vlpi-pdk-001/pdks/mock-thermal-fail.yaml"
      expectedDisposition: "incompatible"
      expectedFailureDimension: "thermalModel"
    - id: "MOCK-WAFER-TOPOLOGY-FAIL"
      class: "hostile-mock"
      fixture: "examples/vlpi-pdk-001/pdks/mock-wafer-topology-fail.yaml"
      expectedDisposition: "incompatible"
      expectedFailureDimension: "waferComposition"
    - id: "OPEN-PDK-CONTROL-NOT-RUN"
      class: "external-open-control"
      fixture: "examples/vlpi-pdk-001/pdks/open-control-not-run.yaml"
      expectedDisposition: "not-run"
  stoppingRules:
    - "Never alter the controlled RU to satisfy a PDK."
    - "Never infer physical performance from capability metadata."
    - "Never promote a harness result to fabrication, measurement, PVR PASS, or BIST PASS."
    - "External PDK execution requires lawful local installation and appropriate toolchain access."
  outputs:
    matrix: "verification/pdk/VLPI-PDK-001-results.yaml"
    schema: "schema/pdk/pdk-compatibility.schema.yaml"
